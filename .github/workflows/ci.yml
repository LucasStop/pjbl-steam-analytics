name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notebooks são JSON válido
        run: python3 -c "import glob,json; [json.load(open(f)) for f in glob.glob('Notebooks/*.ipynb')]"
